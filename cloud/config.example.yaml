# A standalone node (no peers). Paths are relative to where musql-cloud runs.
# The admin is not configured here: run musql-cloud init --admin-email <email>.
listen: ":8080"
public_url: "http://localhost:8080"
data_dir: ".cloud-dev/data"
console:
  dir: "cloud/console/dist"
snapshots:
  every: "1h"
  keep: "168h"
ai:
  provider: ""   # jitllm | openai | anthropic | openrouter
