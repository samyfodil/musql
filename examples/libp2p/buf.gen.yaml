version: v2
plugins:
  - local: protoc-gen-go
    out: pb
    opt:
      - paths=source_relative
  # See the repository root's buf.gen.yaml for the version to install.
  - local: protoc-gen-go-vtproto
    out: pb
    opt:
      - paths=source_relative
      - features=marshal+unmarshal+unmarshal_unsafe+size
