syntax = "proto3";

package cloud.v1;

import "cloud/v1/common.proto";
import "google/protobuf/timestamp.proto";

service AuthService {
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  rpc ListPlatformTokens(ListPlatformTokensRequest) returns (ListPlatformTokensResponse);
  rpc CreatePlatformToken(CreatePlatformTokenRequest) returns (CreatePlatformTokenResponse);
  rpc RevokePlatformToken(RevokePlatformTokenRequest) returns (RevokePlatformTokenResponse);
}

message WhoAmIRequest {}

message WhoAmIResponse {
  User user = 1;
  repeated OrgRole memberships = 2;
}

message OrgRole {
  Org org = 1;
  Role role = 2;
}

message PlatformToken {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp last_used_at = 4;
}

message ListPlatformTokensRequest {}

message ListPlatformTokensResponse {
  repeated PlatformToken tokens = 1;
}

message CreatePlatformTokenRequest {
  string name = 1;
}

message CreatePlatformTokenResponse {
  PlatformToken token = 1;
  // The secret, shown once.
  string secret = 2;
}

message RevokePlatformTokenRequest {
  string id = 1;
}

message RevokePlatformTokenResponse {}
