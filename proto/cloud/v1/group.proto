syntax = "proto3";

package cloud.v1;

import "cloud/v1/common.proto";

service GroupService {
  rpc List(ListGroupsRequest) returns (ListGroupsResponse);
  rpc Create(CreateGroupRequest) returns (CreateGroupResponse);
  rpc Delete(DeleteGroupRequest) returns (DeleteGroupResponse);
  rpc AddLocation(AddLocationRequest) returns (AddLocationResponse);
  rpc RemoveLocation(RemoveLocationRequest) returns (RemoveLocationResponse);
  rpc ListLocations(ListLocationsRequest) returns (ListLocationsResponse);
}

message ListGroupsRequest {
  string org = 1;
}

message ListGroupsResponse {
  repeated Group groups = 1;
}

message CreateGroupRequest {
  string org = 1;
  string name = 2;
  // The primary location; the node's own when empty.
  string location = 3;
}

message CreateGroupResponse {
  Group group = 1;
}

message DeleteGroupRequest {
  string org = 1;
  string name = 2;
}

message DeleteGroupResponse {}

message AddLocationRequest {
  string org = 1;
  string group = 2;
  string location = 3;
}

message AddLocationResponse {
  Group group = 1;
}

message RemoveLocationRequest {
  string org = 1;
  string group = 2;
  string location = 3;
}

message RemoveLocationResponse {
  Group group = 1;
}

message Location {
  string code = 1;
  string node = 2;
}

// ListLocations lists the locations this deployment's nodes serve.
message ListLocationsRequest {}

message ListLocationsResponse {
  repeated Location locations = 1;
}
