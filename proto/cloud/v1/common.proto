syntax = "proto3";

package cloud.v1;

import "google/protobuf/timestamp.proto";

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_VIEWER = 1;
  ROLE_MEMBER = 2;
  ROLE_ADMIN = 3;
  ROLE_OWNER = 4;
}

// How a database is kept. plain is a regular database: on a standalone node
// the full engine, in a cluster replicated to its group's nodes and written
// by the master raft elects among them. crdt replicates across a cluster's
// nodes, every one of them writing. raft is plain.
enum DatabaseType {
  DATABASE_TYPE_UNSPECIFIED = 0;
  DATABASE_TYPE_PLAIN = 1;
  DATABASE_TYPE_CRDT = 2;
  DATABASE_TYPE_RAFT = 3;
}

// How a regular database's commits are kept in a cluster. DURABLE, the
// default: a commit returns once a majority of its group's nodes hold it, so
// the master stopping loses none. FAST: a commit returns once the master holds
// it, and the others copy it right after; a master that stops first takes its
// last commits along. A crdt database and a standalone node's have neither.
enum Durability {
  DURABILITY_UNSPECIFIED = 0;
  DURABILITY_DURABLE = 1;
  DURABILITY_FAST = 2;
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  bool disabled = 4;
  bool admin = 5;
  google.protobuf.Timestamp created_at = 6;
}

message Org {
  string id = 1;
  string slug = 2;
  string name = 3;
  bool personal = 4;
  google.protobuf.Timestamp created_at = 5;
}

message Member {
  User user = 1;
  Role role = 2;
}

message Invite {
  string id = 1;
  string org = 2;
  string email = 3;
  Role role = 4;
  google.protobuf.Timestamp created_at = 5;
}

message Group {
  string name = 1;
  string org = 2;
  string primary = 3;
  repeated string locations = 4;
  google.protobuf.Timestamp created_at = 5;
  // What the group's databases default to.
  DatabaseType type = 6;
  // While set, the group cannot be deleted.
  bool delete_protection = 7;
  string id = 8;
}

message Database {
  string id = 1;
  string org = 2;
  string name = 3;
  string group = 4;
  string url = 5;
  int64 size_bytes = 6;
  string parent = 7;
  google.protobuf.Timestamp parent_at = 8;
  bool schema_only = 9;
  google.protobuf.Timestamp created_at = 10;
  DatabaseType type = 11;
  Durability durability = 12;
  // While set, the database cannot be deleted.
  bool delete_protection = 13;
  // Hrana refuses every statement while block_reads is set, and every
  // statement that writes while block_writes is, with the error code BLOCKED.
  bool block_reads = 14;
  bool block_writes = 15;
}

// A database deleted and kept until expires_at, when it is removed with its
// history; until then RestoreDeleted brings it back.
message DeletedDatabase {
  Database database = 1;
  google.protobuf.Timestamp deleted_at = 2;
  google.protobuf.Timestamp expires_at = 3;
  // Set when it was deleted with its group: restoring the group restores it.
  string deleted_with_group = 4;
}

// A deleted group, kept with the databases deleted with it.
message DeletedGroup {
  Group group = 1;
  google.protobuf.Timestamp deleted_at = 2;
  google.protobuf.Timestamp expires_at = 3;
}
