version: v2

# Regenerate with `buf generate` from the repository root. `clean` makes the
# output a function of the .proto files alone.
clean: true

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/samyfodil/musql/hrana/gen

plugins:
  - local: protoc-gen-go
    out: hrana/gen
    opt: paths=source_relative
