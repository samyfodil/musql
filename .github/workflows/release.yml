name: release

# Pushing a tag v* builds musqld, musql-convert and the Doom example for every
# target and attaches them to a GitHub release. Everything is pure Go
# (CGO_ENABLED=0), so one Linux runner cross-compiles all of it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/doom/go.sum
      - name: build
        run: |
          set -euo pipefail
          ext=""; [ "$GOOS" = windows ] && ext=.exe
          name="musql-${GOOS}-${GOARCH}"
          out="$PWD/dist/$name"
          mkdir -p "$out"
          flags=(-trimpath -ldflags="-s -w")
          (cd hrana && go build "${flags[@]}" -o "$out/musqld$ext" ./cmd/musqld)
          go build "${flags[@]}" -o "$out/musql-convert$ext" ./cmd/musql-convert
          (cd examples/doom && go build "${flags[@]}" -o "$out/musql-doom$ext" ./cmd/doom)
          cp LICENSE README.md "$out/"
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Only the build archives: the image job's build action uploads a
      # build-record artifact of its own, which cannot be extracted here, and a
      # bare download takes every artifact the run has.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{linux,darwin,windows}-*"
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
